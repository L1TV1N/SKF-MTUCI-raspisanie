# /etc/nginx/sites-available/raspisan — __DOMAIN__ подставляет setup.sh
limit_req_zone $binary_remote_addr zone=raspisan_login:10m rate=10r/m;

server {
    # сервер только под расписание, поэтому оно же отвечает и по голому ip
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/calendar;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # подбор пароля админки: не больше 10 попыток в минуту с одного адреса
    location = /api/login {
        limit_req zone=raspisan_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}
